# Same three gates as the git hooks: formatting, analyzers (warnings are errors), tests.
image: mcr.microsoft.com/dotnet/sdk:10.0

stages: [check, test, publish]

variables:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  NUGET_PACKAGES: $CI_PROJECT_DIR/.nuget

cache:
  key: nuget
  paths: [.nuget/]

format:
  stage: check
  script:
    - dotnet tool restore
    - dotnet csharpier check .

build:
  stage: check
  script:
    - dotnet build -c Release --nologo

resharper:
  stage: check
  script:
    - apt-get update -qq && apt-get install -y -qq git >/dev/null
    - dotnet build --nologo
    - scripts/inspect.sh
  artifacts:
    when: on_failure
    paths: [obj/inspectcode.txt, obj/inspectcode.txt.log]

test:
  stage: test
  script:
    - dotnet test -c Release --nologo --logger "junit;LogFilePath=TestResults/junit.xml" || dotnet test -c Release --nologo
  artifacts:
    when: always
    reports:
      junit: "**/TestResults/*.xml"

publish:
  stage: publish
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - dotnet publish src/SteamRip.App -c Release -r linux-x64 -o out/linux-x64
    - dotnet publish src/SteamRip.App -c Release -r win-x64 -o out/win-x64
  artifacts:
    paths: [out/]
