# Shared by every job: .NET SDK, NuGet cache, local tools (CSharpier, ReSharper CLI), restore.
name: Set up .NET
description: Install the .NET SDK, restore NuGet packages and the local dotnet tools

runs:
  using: composite
  steps:
    - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        dotnet-version: 10.0.x

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'dotnet-tools.json') }}
        restore-keys: nuget-${{ runner.os }}-

    - run: dotnet tool restore
      shell: bash

    - run: dotnet restore SteamRip.slnx
      shell: bash
