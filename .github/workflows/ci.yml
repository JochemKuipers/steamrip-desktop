# Same gates as the git hooks (see AGENTS.md): formatting, analyzers with warnings as errors, tests, ReSharper.
# Plus packaging jobs so every push to master leaves installable builds behind (14 days) and the Windows
# build is proven on a Windows runner.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  format:
    name: CSharpier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: dotnet csharpier check .

  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: dotnet build -c Release
      - run: dotnet test -c Release --no-build --logger "trx;LogFileName=results.trx"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: "**/TestResults/*.trx"
          retention-days: 7

  resharper:
    name: ReSharper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: dotnet build
      - run: scripts/inspect.sh
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: resharper-report
          path: |
            obj/inspectcode.txt
            obj/inspectcode.txt.log
          retention-days: 7

  package-linux:
    name: Package (deb, rpm, Arch, AppImage)
    needs: [format, build-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe needs the tags
      - uses: ./.github/actions/setup
      - run: scripts/package.sh
      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ github.sha }}
          path: dist/
          retention-days: 14

  package-windows:
    name: Package (Windows installer)
    needs: [format, build-test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: ./scripts/package-windows.ps1
        shell: pwsh
      - uses: actions/upload-artifact@v7
        with:
          name: windows-${{ github.sha }}
          path: dist/
          retention-days: 14
