# Cut a release by pushing a tag: `make release VERSION=1.2.3` (runs the full gate, tags v1.2.3, pushes).
# This builds every package, publishes a GitHub Release with auto-generated notes, and updates the AUR package
# (aur.yml, plain ssh with AUR_SSH_PRIVATE_KEY).
# Tags with a pre-release suffix (v1.2.3-rc1) are marked pre-release and skip the AUR update.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  linux:
    name: Linux packages (deb, rpm, Arch, AppImage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Gate (build with warnings as errors, tests)
        run: |
          dotnet build -c Release
          dotnet test -c Release --no-build
      - run: VERSION="${GITHUB_REF_NAME#v}" scripts/package.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: dist/
          if-no-files-found: error

  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: ./scripts/package-windows.ps1 -Version ($env:GITHUB_REF_NAME.TrimStart('v'))
        shell: pwsh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: dist/
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        id: sums
        working-directory: dist
        run: |
          sha256sum ./* | sed 's|\./||' > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Release notes header
        run: |
          v="${GITHUB_REF_NAME#v}"
          {
            echo "Self-contained builds; nothing else to install. Settings, library and database are kept across upgrades."
            echo
            echo "| Platform | Package | Install |"
            echo "|---|---|---|"
            echo "| Windows 10/11 x64 | \`steamrip-desktop-$v-setup.exe\` | run it (per-user, no admin) |"
            echo "| Arch / CachyOS / Manjaro | AUR \`steamrip-desktop-bin\` | \`paru -S steamrip-desktop-bin\`, or \`sudo pacman -U\` the \`.pkg.tar.zst\` |"
            echo "| Debian / Ubuntu / Mint | \`.deb\` | \`sudo apt install ./steamrip-desktop_${v}-1_amd64.deb\` |"
            echo "| Fedora / openSUSE | \`.rpm\` | \`sudo dnf install ./steamrip-desktop-$v-1.x86_64.rpm\` |"
            echo "| Any Linux | \`.AppImage\` | \`chmod +x\`, run |"
            echo
            echo "On Linux the app shells out to \`unrar\`/\`7z\`, \`umu-run\` (or \`wine\`) and \`secret-tool\`; the packages list them as dependencies or recommendations. A FlareSolverr instance is configured in Settings. Checksums in \`SHA256SUMS.txt\`."
            echo
          } > notes.md

      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: ${{ github.ref_name }}
          body_path: notes.md
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            dist/*.exe
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
            dist/*.AppImage
            dist/SHA256SUMS.txt

  aur:
    name: AUR
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    uses: ./.github/workflows/aur.yml
    with:
      version: ${{ github.ref_name }}
    secrets: inherit
