# Publish steamrip-desktop-bin to the AUR for an already published GitHub release.
# Called by release.yml after the release exists; also runnable by hand for any version.
# Same plain-ssh approach as the other AUR repos: only AUR_SSH_PRIVATE_KEY is needed.
name: AUR

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Released version to publish (e.g. 2026.11.7)
        required: true
        type: string

permissions:
  contents: read

jobs:
  aur:
    name: steamrip-desktop-bin ${{ inputs.version }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ -n "$AUR_SSH_PRIVATE_KEY" ]] || { echo "missing secret AUR_SSH_PRIVATE_KEY" >&2; exit 1; }
          scripts/aur-publish.sh "${{ inputs.version }}"
